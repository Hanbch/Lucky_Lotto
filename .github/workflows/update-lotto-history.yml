# 로또 역대 draws 자동 갱신
name: Update lotto history

on:
  schedule:
    # 매주 목요일 07:35 UTC = 목요일 16:35 KST
    - cron: "35 7 * * 4"
  workflow_dispatch: # 수동 실행용

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update lotto_history.json
        run: node update-lotto-history.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto_history.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update lotto_history.json to latest draw"
            git push
          fi
